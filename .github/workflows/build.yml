# Workflow name
name: CI/CD Pipeline

on:
  # Manually trigger workflow runs
  workflow_dispatch:
  # Trigger the workflow on push to main and feature branches (trunk based)
  push:
    branches:
      - main
      - 'feature/**'
  # Trigger the workflow on pull requests targeting main
  pull_request:
    branches:
      - main

# The Spring Boot backend lives in the banco2025 folder
defaults:
  run:
    working-directory: banco2025

jobs:
  # Test's job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          cache-dependency-path: banco2025/pom.xml

      # Tests use an in-memory H2 database (no MySQL needed)
      - name: Run Tests
        run: mvn -B test

  # Sonar's job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          cache-dependency-path: banco2025/pom.xml

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Camila-cabarcas_banco-2025-lab
          -Dsonar.organization=camila-cabarcas
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN

      # Upload JaCoCo coverage report to Coveralls
      # Pinned to the full commit SHA of v2.3.8 (security best practice)
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: banco2025/target/site/jacoco/jacoco.xml
          format: jacoco

  # Build's job
  build:
    name: Build
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
          cache-dependency-path: banco2025/pom.xml

      # Build the JAR artifact
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # Upload the JAR as a workflow artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: banco2025-jar
          path: banco2025/target/banco2025.jar

      # Build the Docker image with the JAR and push it to Docker Hub (only from main)
      - name: Build & push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker build -t "$DOCKER_USERNAME/banco2025:latest" -t "$DOCKER_USERNAME/banco2025:${GITHUB_SHA::7}" .
          docker push "$DOCKER_USERNAME/banco2025:latest"
          docker push "$DOCKER_USERNAME/banco2025:${GITHUB_SHA::7}"

  # Deploy's job
  deploy:
    name: Deploy to Render
    needs: build
    # Only deploy when code reaches main (trunk based)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Ask Render to pull the new image from Docker Hub and redeploy.
      # If the deploy hook is not configured yet, the step is skipped with a notice.
      - name: Trigger Render deploy
        working-directory: .
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured yet - skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered on Render"
