# Configuracion SOLO para las pruebas: base de datos H2 en memoria.
# Asi las pruebas corren en GitHub Actions sin necesitar MySQL.
spring.application.name=banco2025-test
spring.datasource.url=jdbc:h2:mem:bancotest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
