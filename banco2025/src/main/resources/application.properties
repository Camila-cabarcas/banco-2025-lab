spring.application.name=banco2025
# Puerto: Render lo entrega en la variable PORT; en local usa 8080
server.port=${PORT:8080}

# Base de datos: en la nube se toma de variables de entorno (Render / PostgreSQL).
# Si no existen, usa la base MySQL local de siempre.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/banco2025?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# El driver y el dialecto se detectan automaticamente a partir de la URL (MySQL o PostgreSQL)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true
spring.mvc.contentnegotiation.favor-path-extension=false
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.media-types.json=application/json
